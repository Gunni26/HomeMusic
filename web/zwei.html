<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeMusic 0.2.3</title>

    <link rel="stylesheet" href="/web/style.css?v=25">
</head>

<body>

<div class="container">

    <div class="topbar">

        <div class="brand-row">
            <span class="music-icon">🎵</span>
            <h1>HomeMusic</h1>
        </div>

        <div id="mini-player">

            <button id="playPauseButton" onclick="togglePlay()">▶</button>

            <button id="stopButton" onclick="stopPlayer()">■</button>

            <span id="currentTime">00:00</span>

            <input
                type="range"
                id="progress"
                value="0"
                min="0"
                max="100"
                oninput="seekPlayer()">

            <span id="duration">00:00</span>


        </div>

    </div>

    <p class="subtitle">
        Der schnellste Weg von der Suche zur Musik.
    </p>

    <div id="currentSong">
        🎵 Kein Titel ausgewählt
    </div>

    <div class="filterbox">

        <label>
            <input type="radio" name="searchmode" value="all" checked>
            Alles
        </label>

        <label>
            <input type="radio" name="searchmode" value="artist">
            Interpret
        </label>

        <label>
            <input type="radio" name="searchmode" value="album">
            Album
        </label>

        <label>
            <input type="radio" name="searchmode" value="title">
            Titel
        </label>

        <label>
            <input type="radio" name="searchmode" value="year">
            Jahr
        </label>

    </div>

    <div class="searchbox">

        <input
            type="text"
            id="search"
            placeholder="Interpret, Album, Titel oder Jahr..."
            autofocus>

        <button
            id="clearbutton"
            onclick="clearSearch()"
            title="Suche löschen">
            ❌
        </button>

    </div>

    <div id="importbox">

        <div id="receiver-volume-box">
            

            <input
                type="range"
                id="receiverVolume"
                min="0"
                max="100"
                value="100"
                oninput="setReceiverVolume(this.value)">
        </div>

    </div>

    <div id="playlistbox">

        <select
            id="playlistSelect"
            onchange="loadPlaylistSongs()">

            <option value="">
                Playlist auswählen
            </option>

        </select>

        <div id="playlistStatus"></div>

        <div id="playlistSongs"></div>

    </div>

    <div id="count" class="count">
        0 Treffer
    </div>

    <div id="results-container">

        <table>

            <thead>

                <tr>
                    <th>Interpret</th>
                    <th>Album</th>
                    <th>Titel</th>
                    <th>Jahr</th>
                    <th>＋</th>

                    <th id="player-header">

                        <div id="mini-player">
                            HIER PLAYER
                        </div>

                    </th>

                </tr>

            </thead>

            <tbody id="results">
            </tbody>

        </table>

    </div>

</div>

<footer id="version">
    v0.2.3
</footer>

<script src="/web/script.js?v=3"></script>

</body>
</html>

<style>
#playlistbox {
    margin-bottom: 0 !important;
}

#playlistbox + #count {
    margin-top: 0 !important;
}
</style>

<style>
#playlistbox {
    margin: 0 !important;
    padding: 0 !important;
    height: auto !important;
}

#playlistbox select {
    margin-bottom: 0 !important;
}

#playlistStatus,
#playlistSongs {
    margin: 0 !important;
    padding: 0 !important;
}

#count {
    margin-top: 0 !important;
    padding-top: 0 !important;
}
</style>

<style>
#playlistbox {
    display: flex !important;
    align-items: center !important;
    gap: 6px !important;
    margin: 0 !important;
    padding: 0 !important;
    min-height: 0 !important;
}

#playlistbox select {
    margin: 0 !important;
    padding: 2px 6px !important;
    height: 30px !important;
}

#playlistStatus,
#playlistSongs {
    display: none !important;
}

#count {
    margin: 2px 0 0 0 !important;
    padding: 0 !important;
}
</style>

<style>
#importbox {
    margin: 0 !important;
    padding: 0 !important;
}

#receiver-volume-box {
    margin: 0 !important;
    padding: 0 !important;
}

#playlistbox {
    margin-top: 0 !important;
    margin-bottom: 0 !important;
    padding: 0 !important;
}

#count {
    margin-top: 0 !important;
    margin-bottom: 0 !important;
    padding: 0 !important;
}
</style>
