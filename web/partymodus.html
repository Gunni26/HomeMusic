<script>
async function createParty() {
    const input = document.getElementById("partyName");
    const name = input.value.trim();

    if (!name) {
        alert("Bitte einen Namen für die Party eingeben.");
        return;
    }

    const response = await fetch(
        "/party_create?name=" + encodeURIComponent(name)
    );

    const data = await response.json();

    if (!data.success) {
        alert(data.error || "Party konnte nicht erstellt werden.");
        return;
    }

    document.getElementById("currentParty").textContent =
        "Aktive Party: " + data.name;

    input.value = "";
}
</script>

<script>
async function savePartyPlayer(player) {

    const input = document.getElementById(player + "Name");
    const status = document.getElementById(player + "Status");
    const name = input.value.trim();

    if (!name) {
        alert("Bitte einen Namen eingeben.");
        return;
    }

    const response = await fetch(
        "/party_set_player?player=" +
        encodeURIComponent(player) +
        "&name=" +
        encodeURIComponent(name)
    );

    const data = await response.json();

    if (data.success) {

        status.textContent = "✓ gespeichert";

    } else {

        alert(data.error || "Name konnte nicht gespeichert werden.");

    }
}
</script>

<script>

async function loadSavedPartyData() {

    try {

        // Aktive Party laden
        const partyResponse = await fetch("/party_current");
        const partyData = await partyResponse.json();

        const currentParty = document.getElementById("currentParty");

        if (currentParty && partyData.success && partyData.active) {
            currentParty.textContent =
                "Aktive Party: " + partyData.playlist.name;
        }


        // Gespeicherte Player-Namen laden
        const playersResponse = await fetch("/party_players");
        const playersData = await playersResponse.json();

        if (playersData.success && playersData.players) {

            playersData.players.forEach(player => {

                const input =
                    document.getElementById(player.player + "Name");

                if (input) {
                    input.value = player.name;
                }

                const status =
                    document.getElementById(player.player + "Status");

                if (status) {
                    status.textContent = "✓ gespeichert";
                }

            });
        }

    } catch (error) {

        console.error(
            "Gespeicherte Party-Daten konnten nicht geladen werden:",
            error
        );

    }
}


// Beim Öffnen der Seite automatisch laden
loadSavedPartyData();

</script>

<script>

async function loadPartyRequestList() {

    try {

        const response = await fetch(
            "/party_requests?t=" + Date.now(),
            { cache: "no-store" }
        );

        const data = await response.json();

        const box =
            document.getElementById("partyRequestList");

        if (!box) return;

        if (
            !data.success ||
            !data.requests ||
            data.requests.length === 0
        ) {
            box.innerHTML =
                '<div class="party-request-list-empty">' +
                'Noch keine Wünsche.' +
                '</div>';

            return;
        }

        /*
         * Aktuellen Titel aus dem Receiver holen.
         * request_id ist entscheidend, damit doppelte Titel
         * nicht gleichzeitig markiert werden.
         */
        let currentRequestId = null;

        try {

            const queueResponse = await fetch(
                "/receiver_queue?t=" + Date.now(),
                { cache: "no-store" }
            );

            const queueData =
                await queueResponse.json();

            if (
                queueData.success &&
                queueData.song &&
                queueData.song.request_id
            ) {
                currentRequestId =
                    queueData.song.request_id;
            }

        } catch (error) {
            console.error(
                "Aktuellen Party-Titel:",
                error
            );
        }

        /*
         * Nur neu aufbauen, wenn sich die Anzahl oder
         * die Reihenfolge der Wünsche geändert hat.
         */
        const newSignature = data.requests
            .map(request => request.id)
            .join(",");

        if (box.dataset.signature !== newSignature) {

            box.dataset.signature = newSignature;
            box.innerHTML = "";

            data.requests.forEach(request => {

                const row =
                    document.createElement("div");

                row.className =
                    "party-request-list-row";

                row.dataset.requestId =
                    String(request.id);

                const name =
                    document.createElement("div");

                name.className =
                    "party-request-list-name";

                name.textContent =
                    request.requester_name;

                const song =
                    document.createElement("div");

                song.className =
                    "party-request-list-song";

                song.textContent =
                    (request.artist || "") +
                    " – " +
                    (request.title || "");

                row.appendChild(name);
                row.appendChild(song);

                box.appendChild(row);
            });
        }

        /*
         * Markierung aktualisieren, ohne die Liste
         * neu aufzubauen oder die Scrollposition
         * unnötig zu verändern.
         */
        const rows =
            box.querySelectorAll(
                ".party-request-list-row"
            );

        rows.forEach(row => {

            const isPlaying =
                currentRequestId !== null &&
                row.dataset.requestId ===
                String(currentRequestId);

            row.classList.toggle(
                "party-playing",
                isPlaying
            );
        });

        /*
         * Nur wenn der laufende Titel außerhalb des
         * sichtbaren Bereichs liegt, scrollen.
         *
         * Dabei bleibt er ungefähr auf Position 5.
         */
        if (currentRequestId !== null) {

            const playingRow =
                box.querySelector(
                    '.party-request-list-row[data-request-id="' +
                    currentRequestId +
                    '"]'
                );

            if (playingRow) {

                const boxRect =
                    box.getBoundingClientRect();

                const rowRect =
                    playingRow.getBoundingClientRect();

                const visibleTop =
                    boxRect.top;

                const visibleBottom =
                    boxRect.bottom;

                const isAbove =
                    rowRect.top < visibleTop;

                const isBelow =
                    rowRect.bottom > visibleBottom;

                const rowsArray =
                    Array.from(rows);

                const playingIndex =
                    rowsArray.indexOf(
                        playingRow
                    );

                if (playingIndex >= 0) {

                    /*
                     * Nur automatisch scrollen, wenn sich
                     * der laufende Titel geändert hat.
                     *
                     * Wenn der Benutzer selbst scrollt,
                     * bleibt seine Position erhalten.
                     */
                    const currentKey =
                        String(currentRequestId);

                    if (
                        box.dataset.lastAutoScrolledRequestId ===
                        currentKey
                    ) {
                        return;
                    }

                    box.dataset.lastAutoScrolledRequestId =
                        currentKey;

                    /*
                     * Der laufende Titel soll auf
                     * der 5. sichtbaren Zeile stehen.
                     */
                    const visiblePosition = 4;

                    const boxRect =
                        box.getBoundingClientRect();

                    const playingRect =
                        playingRow.getBoundingClientRect();

                    const rowHeight =
                        playingRow.getBoundingClientRect().height;

                    /*
                     * Zielposition des laufenden Titels:
                     * 5. Zeile innerhalb der sichtbaren Box.
                     */
                    const targetTop =
                        boxRect.top +
                        (rowHeight * visiblePosition);

                    /*
                     * Tatsächliche Differenz zwischen
                     * aktueller und gewünschter Position.
                     */
                    const scrollChange =
                        playingRect.top -
                        targetTop;

                    /*
                     * Neuer Scrollwert.
                     */
                    let newScroll =
                        box.scrollTop +
                        scrollChange;

                    /*
                     * Scrollwert auf den echten Bereich
                     * der Liste begrenzen.
                     */
                    const maxScroll =
                        Math.max(
                            0,
                            box.scrollHeight -
                            box.clientHeight
                        );

                    newScroll =
                        Math.max(
                            0,
                            Math.min(
                                newScroll,
                                maxScroll
                            )
                        );

                    box.scrollTop = newScroll;
                }
            }
        }

    } catch (error) {

        console.error(
            "Fehler beim Laden der Musikwünsche:",
            error
        );
    }
}

// Sofort laden
loadPartyRequestList();


// Automatisch aktualisieren
setInterval(function() {
    loadPartyRequestList();
}, 1000);

</script>

<script>

(function() {

    function formatPartyTime(seconds) {

        seconds = Number(seconds);

        if (!Number.isFinite(seconds) || seconds < 0) {
            seconds = 0;
        }

        seconds = Math.floor(seconds);

        const minutes =
            Math.floor(seconds / 60);

        const secs =
            seconds % 60;

        return String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0");
    }


    function createPartyTransport() {

        const title =
            document.querySelector(
                ".party-request-list-title"
            );

        const list =
            document.getElementById(
                "partyRequestList"
            );

        if (!title || !list) {
            return false;
        }

        if (
            document.getElementById(
                "partyNowPlaying"
            )
        ) {
            return true;
        }

        const nowPlaying =
            document.createElement("div");

        nowPlaying.id =
            "partyNowPlaying";

        nowPlaying.className =
            "party-now-playing";

        nowPlaying.innerHTML =
            'Jetzt läuft: <span id="partyCurrentSong">–</span>' +
            '<span class="party-now-time">' +
            'Noch <span id="partyRemaining">00:00</span>' +
            '</span>';

        const controls =
            document.createElement("div");

        controls.id =
            "partyTransport";

        controls.className =
            "party-transport";

        controls.innerHTML =

            '<button type="button" onclick="partyStart()">▶ Start</button>' +

            '<button type="button" onclick="partyStop()">■ Stopp</button>' +

            '<button type="button" onclick="partyNext()">⏭ Vor</button>' +

            '<button type="button" onclick="partyPrevious()">⏮ Zurück</button>' +
            '<button type="button" onclick="partyRestartList()">🔄 Liste neu starten</button>' +
            '<button type="button" onclick="partyResumeList()">▶ Fortsetzen</button>';

        title.insertAdjacentElement(
            "afterend",
            nowPlaying
        );

        nowPlaying.insertAdjacentElement(
            "afterend",
            controls
        );

        return true;
    }



    /*
     * Party-Liste neu starten
     */
    window.partyRestartList = async function() {

        try {

            const response =
                await fetch(
                    "/party_start_requests?t=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                alert("Die Party-Liste konnte nicht neu gestartet werden.");
                return;
            }

            partyResumeLastSignature = "";

            /*
             * Die neue Position sofort sichern.
             */
            setTimeout(
                function() {
                    savePartyPosition(false);
                },
                500
            );

        } catch (e) {

            alert("Fehler beim Neustart der Party-Liste.");
        }
    };


    /*
     * Aktuelle Position auf dem Pi speichern
     */
    window.savePartyPosition = async function(showMessage) {

        try {

            const response =
                await fetch(
                    "/receiver_queue?t=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {

                if (showMessage) {
                    alert(
                        "Receiver-Queue konnte nicht gelesen werden."
                    );
                }

                return;
            }

            const queue =
                await response.json();

            console.log(
                "HomeMusic Resume Queue:",
                queue
            );

            if (!Array.isArray(queue.songs) ||
                !queue.songs.length) {

                if (showMessage) {
                    alert(
                        "Die aktuelle Musikliste ist leer."
                    );
                }

                return;
            }

            /*
             * Die Queue kann die Position entweder
             * als index oder current_index liefern.
             */
            let index;

            if (Number.isInteger(queue.index)) {

                index = queue.index;

            } else if (
                Number.isInteger(queue.current_index)
            ) {

                index = queue.current_index;

            } else {

                index = 0;
            }

            index =
                Math.max(
                    0,
                    Math.min(
                        index,
                        queue.songs.length - 1
                    )
                );

            const saveResponse =
                await fetch(
                    "/party_resume_save",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            songs: queue.songs,
                            index: index
                        })
                    }
                );

            const result =
                await saveResponse.json();

            console.log(
                "HomeMusic Resume gespeichert:",
                result
            );

            if (!saveResponse.ok ||
                !result.ok) {

                if (showMessage) {
                    alert(
                        "Position konnte nicht gespeichert werden."
                    );
                }

                return;
            }

            if (showMessage) {

                alert(
                    "Position gespeichert: Titel " +
                    (index + 1) +
                    " von " +
                    queue.songs.length
                );
            }

        } catch (e) {

            console.error(
                "Resume speichern:",
                e
            );

            if (showMessage) {

                alert(
                    "Fehler beim Speichern der Position: " +
                    e.message
                );
            }
        }
    };


    /*
     * Gespeicherte Position fortsetzen
     */
    window.partyResumeList = async function() {

        try {

            const response =
                await fetch(
                    "/party_resume_start",
                    {
                        method: "POST"
                    }
                );

            const data =
                await response.json();

            if (!data.ok) {

                alert(
                    data.message ||
                    "Keine gespeicherte Position vorhanden."
                );

                return;
            }

        } catch (e) {

            alert(
                "Die gespeicherte Position konnte nicht geladen werden."
            );
        }
    };


    /*
     * Position automatisch alle 2 Sekunden sichern.
     * Dadurch bleibt die letzte Position auch bei
     * einem Rechner-/Browserabsturz erhalten.
     */
    setInterval(
        function() {
            savePartyPosition(false);
        },
        2000
    );


    window.partyStart = async function() {

        try {

            const response =
                await fetch(
                    "/party_start_after_stop?t=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );

            const data =
                await response.json();

            if (!data.success) {

                if (data.finished) {
                    alert("Das Ende der Wunschliste ist erreicht.");
                } else {
                    alert(
                        data.error ||
                        "Party konnte nicht gestartet werden."
                    );
                }

                return;
            }

            if (data.song) {
                updatePartySong(data.song);
            }

        } catch (error) {

            console.error(
                "Start:",
                error
            );
        }
    };


    window.partyStop = async function() {

        try {

            const response =
                await fetch(
                    "/party_stop_mark?t=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );

            const data =
                await response.json();

            if (!data.success) {
                console.error(
                    "Stopp:",
                    data.error
                );
            }

        } catch (error) {

            console.error(
                "Stopp:",
                error
            );
        }
    };


    window.partyNext = async function() {

        try {

            const response =
                await fetch(
                    "/party_next_request?direction=1&t=" +
                    Date.now()
                );

            const data =
                await response.json();

            if (
                data.success &&
                data.song
            ) {
                updatePartySong(
                    data.song
                );
            }

        } catch (error) {

            console.error(
                "Vor:",
                error
            );
        }
    };


    window.partyPrevious = async function() {

        try {

            const response =
                await fetch(
                    "/party_next_request?direction=-1&t=" +
                    Date.now()
                );

            const data =
                await response.json();

            if (
                data.success &&
                data.song
            ) {
                updatePartySong(
                    data.song
                );
            }

        } catch (error) {

            console.error(
                "Zurück:",
                error
            );
        }
    };


    function updatePartySong(song) {

        const element =
            document.getElementById(
                "partyCurrentSong"
            );

        if (!element) return;

        element.textContent =
            (song.artist || "") +
            " – " +
            (song.title || "");
    }


    async function loadPartyReceiverStatus() {

        try {

            const response =
                await fetch(
                    "/receiver_status?t=" +
                    Date.now(),
                    { cache: "no-store" }
                );

            const data =
                await response.json();

            if (!data.success) {
                return;
            }

            const song =
                document.getElementById(
                    "partyCurrentSong"
                );

            const remaining =
                document.getElementById(
                    "partyRemaining"
                );

            if (!song || !remaining) {
                return;
            }

            if (
                data.artist ||
                data.title
            ) {

                song.textContent =
                    (data.artist || "") +
                    " – " +
                    (data.title || "");

            } else {

                song.textContent = "–";
            }

            const rest =
                Math.max(
                    0,
                    Number(data.duration || 0) -
                    Number(data.current || 0)
                );

            remaining.textContent =
                formatPartyTime(rest);

        } catch (error) {

            console.error(
                "Partymodus Receiver-Status:",
                error
            );
        }
    }


    function initPartyTransport() {

        if (!createPartyTransport()) {
            setTimeout(
                initPartyTransport,
                200
            );
            return;
        }

        loadPartyReceiverStatus();

        setInterval(
            loadPartyReceiverStatus,
            500
        );
    }


    initPartyTransport();

})();

</script>

<!-- ============================================================
     Partymodus – manueller Scroll bleibt stehen
     ============================================================ -->
<script>
(function() {

    const box = document.getElementById("partyRequestList");

    if (!box) return;

    let manualScroll = false;
    let savedScrollTop = 0;

    /*
     * Sobald der Benutzer die Wunschliste selbst bewegt,
     * bekommt der manuelle Scroll Vorrang.
     */
    box.addEventListener("pointerdown", function() {
        manualScroll = true;
        savedScrollTop = box.scrollTop;
    });

    box.addEventListener("wheel", function() {
        manualScroll = true;
        savedScrollTop = box.scrollTop;
    }, { passive: true });

    box.addEventListener("scroll", function() {

        if (manualScroll) {
            savedScrollTop = box.scrollTop;
        }

    }, { passive: true });

    /*
     * Die bisherige automatische Scrollfunktion darf
     * die vom Benutzer gewählte Position nicht mehr verändern.
     */
    setInterval(function() {

        if (manualScroll &&
            Math.abs(box.scrollTop - savedScrollTop) > 1) {

            box.scrollTop = savedScrollTop;
        }

    }, 100);

})();
</script>
